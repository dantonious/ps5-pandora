name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Every source file must be formatted
        run: |
          files=$(git ls-files '*.cpp' '*.hpp')
          if [ -z "$files" ]; then
            echo "::error::no C++ sources found; check the checkout"
            exit 1
          fi
          clang-format --dry-run --Werror $files

  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc, cc: gcc-14, cxx: g++-14 }
          - { os: ubuntu-latest, compiler: clang, cc: clang, cxx: clang++ }
          - { os: macos-latest, compiler: clang, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Show the compiler
        run: ${{ matrix.cxx }} --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (warnings are errors)
        run: cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: address + undefined behaviour
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan -j 3
      - name: Test under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  signoff:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit must be signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .* <.*@.*>'; then
              echo "::error::commit $sha has no Signed-off-by trailer (use: git commit -s)"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing

  package:
    name: package title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 3
      - name: Validate the metadata
        run: ./build/pandora-cli param validate pkg/sce_sys/param.json
      - name: Build the archive
        run: ./build/pandora-cli package pkg dist/PPSA77010.zip
      - name: The title folder must be at the top, checked by an independent zip reader
        run: |
          python3 - <<'PY'
          import json, zipfile

          param = json.load(open("pkg/sce_sys/param.json"))
          title_id = param["titleId"]
          path = f"dist/{title_id}.zip"

          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              assert bad is None, f"CRC check failed on {bad}"
              names = archive.namelist()

          assert f"{title_id}/" in names, f"missing {title_id}/ at the top: {names}"
          assert any(n.startswith(f"{title_id}/sce_sys/") for n in names), names
          print(f"ok: {path} has {len(names)} entries, CRCs verified")
          PY
      - name: The hash the catalog needs
        run: ./build/pandora-cli digest dist/PPSA77010.zip
      - uses: actions/upload-artifact@v4
        with:
          name: title-zip
          path: dist/*.zip
          if-no-files-found: error
