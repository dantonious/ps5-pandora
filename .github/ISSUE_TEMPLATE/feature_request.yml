name: Feature request
description: Propose a capability the project does not have.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem**, not only the solution. A well-framed problem
        often has a better answer than the one originally imagined.

        Substantial features need agreement before code is written — see
        CONTRIBUTING.md, "Before you start".

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to accomplish?
      description: The task or workflow, in your own words.
      placeholder: I want to copy a folder from internal storage to a USB drive without a desktop client.
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: What blocks you today?
      description: What you tried, and where it stopped.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Your idea, if you have one. It is fine not to.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds, and why they are not enough.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Storage / files
        - Payloads
        - Packages
        - Save data
        - Thermal / hardware
        - HTTP API
        - CLI / tooling
        - UI / UX
        - Documentation
        - Build / toolchain
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - label: I would like to implement this myself.
