name: Bug report
description: Something does not work as documented.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more precise this is, the faster it gets fixed.

        **Do not report security vulnerabilities here.** See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what actually happened.
      placeholder: |
        1. Ran `cargo run -p pandora-http`
        2. Opened http://127.0.0.1:7070
        3. Expected the listing, got an empty page
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `pandora --version`, or the commit hash.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - Host (cargo run / cargo test)
        - Console, as a payload
        - Console, installed as a title
        - CI
        - Not sure
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Console firmware version (if applicable)
      placeholder: e.g. 09.00
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `RUST_LOG=debug`. Redact serial numbers, account IDs and anything personal.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
